<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Assistant IA</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      background:#050505;
      color:#fff;
      font-family:Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    .chat{
      width:100%;
      max-width:600px;
      height:85vh;
      max-height:760px;
      background:#0b0b0b;
      border:1px solid #222;
      border-radius:22px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }

    .header{
      padding:20px;
      border-bottom:1px solid #222;
      background:#0f0f0f;
    }

    .brand{
      font-size:12px;
      color:#41e69c;
      font-weight:bold;
      letter-spacing:1px;
      margin-bottom:7px;
    }

    .title{
      font-size:20px;
      font-weight:bold;
    }

    .status{
      margin-top:6px;
      font-size:13px;
      color:#999;
    }

    #messages{
      flex:1;
      overflow-y:auto;
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .message{
      max-width:85%;
      padding:12px 14px;
      border-radius:15px;
      line-height:1.45;
      white-space:pre-wrap;
      font-size:15px;
    }

    .assistant{
      align-self:flex-start;
      background:#171717;
      border:1px solid #262626;
    }

    .user{
      align-self:flex-end;
      background:#fff;
      color:#000;
    }

    .error{
      align-self:center;
      background:#2a1111;
      border:1px solid #693030;
      color:#ffb9b9;
    }

    .typing{
      color:#888;
      font-size:13px;
      padding-left:3px;
    }

    .composer{
      border-top:1px solid #222;
      padding:14px;
      display:flex;
      gap:10px;
      background:#0f0f0f;
    }

    textarea{
      flex:1;
      resize:none;
      min-height:48px;
      max-height:130px;
      padding:13px;
      border-radius:13px;
      border:1px solid #333;
      background:#151515;
      color:#fff;
      font-size:16px;
      outline:none;
      font-family:Arial,sans-serif;
    }

    textarea:focus{
      border-color:#666;
    }

    button{
      min-width:85px;
      border:none;
      border-radius:13px;
      background:#fff;
      color:#000;
      font-weight:bold;
      padding:0 18px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .footer{
      text-align:center;
      padding:0 12px 12px;
      font-size:11px;
      color:#666;
      background:#0f0f0f;
    }

    @media(max-width:600px){
      body{
        padding:0;
      }

      .chat{
        height:100vh;
        max-height:none;
        border-radius:0;
        border:none;
      }

      button{
        min-width:72px;
        padding:0 13px;
      }
    }
  </style>
</head>

<body>

  <div class="chat">

    <div class="header">
      <div class="brand">AUREX AI</div>
      <div class="title" id="businessName">Assistant IA</div>
      <div class="status" id="status">● En ligne</div>
    </div>

    <div id="messages">
      <div class="message assistant">
        Bonjour 👋 Comment puis-je vous aider ?
      </div>
    </div>

    <div class="composer">
      <textarea
        id="messageInput"
        placeholder="Écrivez votre message..."
        rows="1"
      ></textarea>

      <button id="sendButton">
        Envoyer
      </button>
    </div>

    <div class="footer">
      Assistant IA propulsé par AUREX AI
    </div>

  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("session_id");

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const businessNameEl = document.getElementById("businessName");
  const statusEl = document.getElementById("status");

  let history = [];
  let sending = false;

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setTyping(show) {
    const old = document.getElementById("typing");
    if (old) old.remove();

    if (show) {
      const div = document.createElement("div");
      div.id = "typing";
      div.className = "typing";
      div.textContent = "L'assistant écrit...";
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  async function sendMessage() {
    if (sending) return;

    const message = inputEl.value.trim();

    if (!message) return;

    if (!sessionId) {
      addMessage(
        "Accès au chatbot invalide. Veuillez utiliser le lien reçu après votre activation.",
        "error"
      );
      return;
    }

    sending = true;
    sendButton.disabled = true;

    addMessage(message, "user");

    inputEl.value = "";
    inputEl.style.height = "auto";

    setTyping(true);

    try {
      const response = await fetch(
        "/.netlify/functions/client-chat",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sessionId,
            message,
            history
          })
        }
      );

      const data = await response.json();

      setTyping(false);

      if (!response.ok) {
        addMessage(
          data.error || "Assistant temporairement indisponible.",
          "error"
        );

        if (response.status === 403) {
          statusEl.textContent = "● Accès inactif";
        }

        return;
      }

      if (data.entreprise) {
        businessNameEl.textContent =
          "Assistant " + data.entreprise;

        document.title =
          "Assistant " + data.entreprise;
      }

      addMessage(data.answer, "assistant");

      history.push({
        role: "user",
        content: message
      });

      history.push({
        role: "assistant",
        content: data.answer
      });

      history = history.slice(-8);

    } catch (error) {
      setTyping(false);

      addMessage(
        "Impossible de contacter l'assistant pour le moment.",
        "error"
      );
    } finally {
      sending = false;
      sendButton.disabled = false;
      inputEl.focus();
    }
  }

  sendButton.addEventListener("click", sendMessage);

  inputEl.addEventListener("keydown", (event) => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height =
      Math.min(inputEl.scrollHeight, 130) + "px";
  });

  if (!sessionId) {
    statusEl.textContent = "● Activation requise";

    addMessage(
      "Ce chatbot doit être ouvert depuis le lien d'activation Aurex AI.",
      "error"
    );

    sendButton.disabled = true;
    inputEl.disabled = true;
  }
</script>

</body>
</html>
